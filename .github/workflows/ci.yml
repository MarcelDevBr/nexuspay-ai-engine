name: 🚀 NexusPay Microservices CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ===========================================================================
  # ETAPA 1: TESTES UNITÁRIOS E DE DOMÍNIO (PARALELO)
  # ===========================================================================

  test-edge-gateway:
    name: 🌐 Edge Gateway (Node.js 26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install & Test
        working-directory: ./services/edge-gateway
        run: |
          yarn install --force
          yarn test
          yarn build

  test-transaction-ledger-service:
    name: ☕ Transaction Ledger (Java 26 / Spring Boot 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 26 (OpenJDK Early Access)
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '26'
          cache: 'maven'
      - name: Test Spring Boot 4 com Java 26
        working-directory: ./services/transaction-ledger-service
        run: |
          chmod +x mvnw
          ./mvnw test

  test-copilot-rag-service:
    name: 💬 Copilot RAG Service (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv python install 3.14
      - name: Test Copilot
        working-directory: ./services/copilot-rag-service
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest

  test-pos-diagnostics-service:
    name: 📟 POS Diagnostics Service (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv python install 3.14
      - name: Test POS Diagnostics
        working-directory: ./services/pos-diagnostics-service
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest

  test-dispute-agent-worker:
    name: 🤖 Dispute Agent Worker (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv python install 3.14
      - name: Test Dispute Crew Worker
        working-directory: ./services/dispute-agent-worker
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest

  # ===========================================================================
  # ETAPA 2: VALIDAÇÃO DE INFRAESTRUTURA & FINOPS (PARALELO)
  # ===========================================================================

  validate-kubernetes-manifests:
    name: ☸️ Kubernetes EKS Manifests (Kustomize)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Validate Kustomize Build
        run: |
          kustomize build k8s/

  validate-terraform-finops:
    name: ☁️ Terraform & FinOps Budget Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Terraform Init & Validate
        working-directory: ./terraform
        run: |
          terraform init -backend=false
          terraform fmt -check
          terraform validate

  # ===========================================================================
  # ETAPA 3: BUILD PARALELO DOS CONTÊINERES (MATRIX STRATEGY)
  # ===========================================================================

  build-containers:
    name: 🐳 Docker Build (${{ matrix.service.name }})
    needs: [
      test-edge-gateway,
      test-transaction-ledger-service,
      test-copilot-rag-service,
      test-pos-diagnostics-service,
      test-dispute-agent-worker,
      validate-kubernetes-manifests,
      validate-terraform-finops
    ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: "edge-gateway", dir: "services/edge-gateway" }
          - { name: "transaction-ledger-service", dir: "services/transaction-ledger-service" }
          - { name: "copilot-rag-service", dir: "services/copilot-rag-service" }
          - { name: "pos-diagnostics-service", dir: "services/pos-diagnostics-service" }
          - { name: "dispute-agent-worker", dir: "services/dispute-agent-worker" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.dir }}
          file: ./${{ matrix.service.dir }}/Dockerfile
          push: false
