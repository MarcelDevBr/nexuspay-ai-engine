name: 🚀 NexusPay Microservices CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Edge Gateway (Node.js 26)
  # ---------------------------------------------------------------------------
  test-edge-gateway:
    name: 🌐 Edge Gateway (Node.js 26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install & Test
        working-directory: ./services/edge-gateway
        run: |
          yarn install --force
          yarn test
          yarn build

  # ---------------------------------------------------------------------------
  # 2. Transaction Ledger Service (Java 26 / Spring Boot 4)
  # ---------------------------------------------------------------------------
  test-transaction-ledger-service:
    name: ☕ Transaction Ledger (Java 26 / Spring Boot 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 26 (OpenJDK Early Access)
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '26'
          cache: 'maven'
      - name: Test Spring Boot 4 com Java 26
        working-directory: ./services/transaction-ledger-service
        run: |
          chmod +x mvnw
          ./mvnw test

  # ---------------------------------------------------------------------------
  # 3. Copilot RAG Service (Python 3.14)
  # ---------------------------------------------------------------------------
  test-copilot-rag-service:
    name: 💬 Copilot RAG Service (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv python install 3.14
      - name: Test Copilot
        working-directory: ./services/copilot-rag-service
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest

  # ---------------------------------------------------------------------------
  # 4. POS Diagnostics Service (Python 3.14)
  # ---------------------------------------------------------------------------
  test-pos-diagnostics-service:
    name: 📟 POS Diagnostics Service (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv python install 3.14
      - name: Test POS Diagnostics
        working-directory: ./services/pos-diagnostics-service
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest

  # ---------------------------------------------------------------------------
  # 5. Dispute Agent Worker (Python 3.14)
  # ---------------------------------------------------------------------------
  test-dispute-agent-worker:
    name: 🤖 Dispute Agent Worker (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv python install 3.14
      - name: Test Dispute Crew Worker
        working-directory: ./services/dispute-agent-worker
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest

  # ---------------------------------------------------------------------------
  # 6. Kubernetes & Kustomize Manifests Validation (Amazon EKS)
  # ---------------------------------------------------------------------------
  validate-kubernetes-manifests:
    name: ☸️ Kubernetes EKS Manifests (Kustomize)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Validate Kustomize Build
        run: |
          kustomize build k8s/

  # ---------------------------------------------------------------------------
  # 7. Docker Build Verification dos 5 Microsserviços
  # ---------------------------------------------------------------------------
  docker-build-verification:
    name: 🐳 Docker Build Verification (5 Microservices)
    needs: [
      test-edge-gateway,
      test-transaction-ledger-service,
      test-copilot-rag-service,
      test-pos-diagnostics-service,
      test-dispute-agent-worker,
      validate-kubernetes-manifests
    ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build Edge Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./services/edge-gateway
          file: ./services/edge-gateway/Dockerfile
          push: false

      - name: Build Transaction Ledger Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/transaction-ledger-service
          file: ./services/transaction-ledger-service/Dockerfile
          push: false

      - name: Build Copilot RAG Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/copilot-rag-service
          file: ./services/copilot-rag-service/Dockerfile
          push: false

      - name: Build POS Diagnostics Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/pos-diagnostics-service
          file: ./services/pos-diagnostics-service/Dockerfile
          push: false

      - name: Build Dispute Agent Worker
        uses: docker/build-push-action@v5
        with:
          context: ./services/dispute-agent-worker
          file: ./services/dispute-agent-worker/Dockerfile
          push: false
