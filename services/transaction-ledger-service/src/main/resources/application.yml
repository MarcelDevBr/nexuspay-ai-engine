server:
  port: 8081

spring:
  application:
    name: nexuspay-transactional-core
  threads:
    virtual:
      enabled: true # Habilita Virtual Threads (Project Loom) nativo no Java 21
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexuspay_db}
    username: ${DB_USER:nexus_user}
    password: ${DB_PASSWORD:nexus_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: none # DDL gerenciado pelos scripts de migração/init-db
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-url: ${AWS_ENDPOINT_URL:http://localhost:4566}
  sqs:
    queue-url: ${SQS_QUEUE_URL:http://localhost:4566/000000000000/transacoes-events}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
