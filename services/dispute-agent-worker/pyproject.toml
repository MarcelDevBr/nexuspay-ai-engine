[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexuspay-dispute-agent-worker"
version = "1.0.0"
description = "NexusPay Autonomous Multi-Agent Dispute Resolution Worker (CrewAI / SQS)"
authors = [{ name = "Marcel da Silva Almeida", email = "contato@marcelalmeida.dev" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "boto3>=1.35.0",
    "psycopg2-binary>=2.9.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
